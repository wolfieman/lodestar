name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit tests (offline)
        env:
          TEST_MODE: "true"
        run: uv run pytest -m unit

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node (22 LTS)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (vitest, offline)
        # Runs the default config only. The *.workers.test.ts SELF.fetch suite
        # (vitest.workers.config.ts) is intentionally excluded: the same
        # scenarios are covered Node-natively by chat.test.ts, and the
        # workers-pool runner is kept staged until it runs cleanly in CI.
        run: npx vitest run

  # Test-gated auto-deploy: a push to main that passes BOTH suites deploys the
  # Worker (push-to-main == deploy). Secrets: CLOUDFLARE_API_TOKEN (scoped:
  # Workers Scripts:Edit + Routes:Edit + Vectorize:Edit + Workers AI:Read),
  # CLOUDFLARE_ACCOUNT_ID. PRs and branches never deploy.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, worker]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node (22 LTS)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
