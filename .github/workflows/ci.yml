name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit tests (offline)
        env:
          TEST_MODE: "true"
        run: uv run pytest -m unit

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node (22 LTS)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (vitest, offline)
        # Runs the default config only. The *.workers.test.ts SELF.fetch suite
        # (vitest.workers.config.ts) is intentionally excluded: the same
        # scenarios are covered Node-natively by chat.test.ts, and the
        # workers-pool runner is kept staged until it runs cleanly in CI.
        run: npx vitest run

  # Deploys are handled by Cloudflare Workers Builds (the Worker's native Git
  # connection to this repo): on a push to main, Cloudflare runs
  # `npm ci && npx tsc --noEmit && npx vitest run` as the build gate and then
  # `npx wrangler deploy` from /worker. The jobs above remain the PR/branch
  # quality signal (including the Python parity suite, which Cloudflare's
  # builder cannot run).
